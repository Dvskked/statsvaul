[package]
name = "cli-stats-vault"
version = "0.1.0"
edition = "2024"
description = "A lightweight, educational CLI that computes basic statistics (average, min, max, standard deviation) from a JSON dataset of scores."
license = "MIT"
keywords = ["cli", "statistics", "json", "educational"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true